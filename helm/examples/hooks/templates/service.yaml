apiVersion: v1
kind: Service
metadata:
  name: {{ include "hooks.fullname" . }}
  labels:
    {{- include "hooks.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "hooks.selectorLabels" . | nindent 4 }} 
